name: Verify DotMatch source archive SHA256
on:
  push:
    branches: [verify-dotmatch-archive-20260925]
jobs:
  sha256:
    runs-on: ubuntu-latest
    steps:
      - name: Download immutable v0.6.0 archive and print its SHA256
        run: |
          curl -fL --retry 3 -o dotmatch-v0.6.0.tar.gz https://github.com/dnncha/dotmatch/archive/refs/tags/v0.6.0.tar.gz
          sha256sum dotmatch-v0.6.0.tar.gz
